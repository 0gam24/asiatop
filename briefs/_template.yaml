# ════════════════════════════════════════════════════════════════
# 머니룩 Brief 템플릿
# 작성 시간 목표: 10~15분
# 검증: pnpm brief:validate briefs/{이파일경로}
# 새 brief 생성: pnpm brief:new (이 파일을 복사해 meta 자동 채움)
# ════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────
# 메타 — 시스템이 글을 식별·라우팅하는 정보
# ─────────────────────────────────────────────
meta:
  brief_id: ""              # 예: "2026-05-08-didimdol-vs-bogeumjari" (= scheduled_publish + "-" + slug)
  slug: ""                  # 예: "didimdol-vs-bogeumjari-which-is-better" (영문 소문자·하이픈만, 50자 이내)
  cluster: ""               # 12개 중 하나: gov-support, tax, realestate, unemployment, savings,
                            #               insurance-labor, auto, public-services, office-tips,
                            #               credit-loan, insurance-personal, pension
  scheduled_publish: ""     # YYYY-MM-DD (발행 예정일)
  priority: "medium"        # high | medium | low
  brief_author: ""          # 예: "junhyeok" (brief 작성자, 글 저자 X)
  created_at: ""            # YYYY-MM-DD (이 brief 작성일)

# ─────────────────────────────────────────────
# 누구를 위한 글인가 — 구체적인 한 명을 상상해서 작성
# ─────────────────────────────────────────────
niche:
  audience_persona: |
    # 한 명의 구체적 인물로 묘사. 통계적 일반화 금지.
    # 예: "35세 남성 직장인, 결혼 4년차, 자녀 1명(만 2세), 연봉 6,200만원,
    #      서울 강서구 전세 거주, 첫 내 집 마련을 고민 중. 부동산은 어렵다고 느낌."
  life_context: |
    # 이 사람의 현재 상황·맥락 (검색 시점에 어떤 일이 벌어지고 있나)
    # 예: "전세 만기 6개월 전, 집주인이 보증금 5천만 인상 요구. 출퇴근 1시간 30분으로 피로 누적.
    #      친구가 디딤돌 받았다는 소식 듣고 처음 자세히 알아보기 시작."
  surface_pain: |
    # 표면적으로 검색창에 치는 말 (검색 의도)
    # 예: "디딤돌 받을 수 있는지 모르겠다. 보금자리랑 뭐가 다른지 모르겠다."
  hidden_anxiety: |
    # 표면 페인 뒤의 진짜 불안 (실제로는 이게 더 큼)
    # 예: "지금 안 사면 영영 못 산다는 두려움. 가족 부양 책임감. 잘못된 선택으로 자녀에게 피해 주는 것."
  desired_next_action: |
    # 글을 다 읽고 나서 어떤 행동을 할 것인가 (구체적·검증 가능한 행동)
    # 예: "본인 자격을 확신하고 주택도시기금 사이트에서 사전 자격 조회 → 영업점 방문 예약"
  do_not_say:                # 이 독자가 절대 듣고 싶지 않은 말 (3~5개)
    - ""                     # 예: "내 집 마련은 무리예요"
    - ""                     # 예: "전세가 더 싸요"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 8차원 질문자 프로파일링 (자동 추출 또는 작성자 입력)
  # 결정적 차원(1·5·6·8) 미충족 시 brief 우선순위 강등 또는 폐기.
  # 권고 차원(2·3·4·7) 누락 허용 — 본문 톤만 일반화.
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  search_timing:             # 차원 1 — 결정적
    month: ""                # "01"~"12" 또는 ""
    weekday: ""              # "Mon"~"Sun" 또는 ""
    policy_proximity: ""     # 예: "T-7d:종소세" / "T+30d:청년월세-2차" / null
  life_stage: "unspecified"  # 차원 2 — 권고. enum: early-career | pre-marriage | new-parent | career-transition | pre-retirement | unspecified
  employment_type: "unspecified"  # 차원 3 — 권고. enum: salaried | freelance | self-employed | public | part-time | unspecified
  region: "nationwide"       # 차원 4 — 권고. ISO 시도코드 또는 "nationwide"
  prior_attempts: []         # 차원 5 — 결정적. enum 배열: rejected | reapply | first-time | doc-incomplete | timing-missed
  competing_options: []      # 차원 6 — 결정적. 화이트리스트 매칭 제도·상품 (≥2개 시 비교표 자동 트리거)
  hidden_anxiety_tags: []    # 차원 7 — 권고. enum 배열: 자격_미달_공포 | 기회_상실_공포 | 가족_부담 | 타이밍_놓침 | 서류_복잡성 | 정보_과부하 | 사기_피해_공포 | 낙인_공포 | 소득_노출_공포 | 세무조사_공포 | 이혼_재산_공포 | 해고_공포
  source_signal:             # 차원 8 — 결정적
    description_length: 0    # 네이버 API description 길이 (문자)
    answer_count: 0          # 답변 개수 (지식인)
    repeat_count: 0          # 같은 의미 질문 90일 누적
    unmet_market_score: 0    # 0~3 (높을수록 시장 미해결 페인)

# ─────────────────────────────────────────────
# 검색 의도 — 이 글이 답해야 할 질문
# ─────────────────────────────────────────────
reader_intent:
  primary_question: ""       # 한 문장. 예: "디딤돌과 보금자리 중 나에게 맞는 건?"
  sub_questions:             # 글이 답해야 할 하위 질문 (3~7개)
    - ""                     # 예: "자격 조건이 어떻게 다른가?"
    - ""                     # 예: "월 상환액 차이는?"
  competitor_options_in_mind:  # 독자가 검색하며 동시에 비교 중인 다른 선택지 (1~5개)
    - ""                     # 예: "전세대출 갱신"
    - ""                     # 예: "버팀목 전세"
  competitor_content_weakness: |
    # 검색 1페이지 기존 글 5개의 공통 약점 (1~3개)
    # 예: "수치만 나열하고 '나는 어디 해당?' 판단 도구 없음. 갱신일·요율 명시 누락 흔함.
    #      디딤돌 vs 보금자리 핵심 분기점(소득·주택가·자녀)을 정면으로 비교하지 않음."

# ─────────────────────────────────────────────
# SEO 키워드
# ─────────────────────────────────────────────
keywords:
  primary: ""                # 메인 키워드 1개. 예: "디딤돌 보금자리 차이"
  secondary:                 # 보조 키워드 2~5개
    - ""                     # 예: "디딤돌 자격"
    - ""                     # 예: "보금자리 한도"
  longtail:                  # 롱테일 키워드 3~5개 (검색량 적지만 전환 높음)
    - ""                     # 예: "신혼부부 디딤돌 보금자리 어느게 유리"
  search_volume_estimate: "" # 선택. 예: "월 4,000~6,000회"
  competition: "medium"      # 선택. low | medium | high

# ─────────────────────────────────────────────
# 차별화 — GEO(AI 답변 엔진) 인용 가능성 핵심
# ─────────────────────────────────────────────
content_angle:
  one_line_pitch: ""         # 한 줄로 이 글의 차별점
                             # 예: "소득·주택가·자녀 수 3가지 분기점으로 바로 판단되는 디딤돌 vs 보금자리"
  framing: ""                # decision-guide | explainer | how-to | comparison | warning | case-study
  not_framing: ""            # 이 글이 아닌 것 (혼동 방지)
                             # 예: "은행 영업 글이 아님. 가입 후기 X. 일반론 X."
  unique_value:              # 다른 사이트와 다른 가치 2~4개
    - ""                     # 예: "본인 자격 자동 진단 표"
    - ""                     # 예: "월 상환액 시뮬레이션 1차 자료 기반"
  citable_sentences:         # AI 검색이 단답형으로 인용할 문장 3~5개
                             # — 짧고 명확하고 출처 가능한 사실 진술
    - ""                     # 예: "디딤돌은 부부합산 7천만 이하, 보금자리는 1억 이하 (2026년 4월 기준)"

# ─────────────────────────────────────────────
# 1차 자료 — 반드시 정부·공공기관 출처
# (.go.kr, .or.kr, gov.kr, korea.kr 등 화이트리스트)
# ─────────────────────────────────────────────
primary_sources:
  - id: src1                 # 본문·structure에서 참조할 ID (src1, src2, ...)
    url: ""                  # 예: "https://nhuf.molit.go.kr/FP/FP05/FP0509/FP05090101.jsp"
    title: ""                # 예: "주택도시기금 — 디딤돌대출 안내"
    expected_facts:          # 이 출처에서 가져올 사실 (1~5개)
      - ""                   # 예: "소득 기준 7,000만원 이하"
      - ""                   # 예: "한도 최대 4억"
    must_quote: true         # 본문에 직접 인용 필수면 true
secondary_sources: []        # 보조 출처 (선택, 같은 형식)

# ─────────────────────────────────────────────
# 글 구조 — 섹션·길이·표·계산기 사전 결정
# ─────────────────────────────────────────────
structure:
  intro_pattern: "answer-first"   # audience-pain-first | answer-first | story-first | data-first
  sections:                       # H2 7~9개. 각 섹션이 답할 sub_question 매핑
    - h2: ""                      # 예: "디딤돌 vs 보금자리, 한 줄 차이"
      content_hint: ""            # 이 섹션에서 다룰 핵심
      uses_facts_from: [src1]     # 이 섹션이 인용할 출처 ID (배열)
      requires_table: false       # 표 필요 여부
      requires_calculation: false # 계산 시뮬레이션 필요 여부
  faq:
    count: 5                      # FAQ 개수 (3~7)
    must_include_questions:       # 반드시 포함할 질문 (검색 빈출)
      - ""                        # 예: "디딤돌 받았다가 소득 늘면 어떻게 돼?"
  word_count_target: 2500         # 한국어 어절 기준 목표
  word_count_min: 2000
  word_count_max: 3500

# ─────────────────────────────────────────────
# 내부 링크 — 토픽 권한·체류시간 강화
# ─────────────────────────────────────────────
internal_links:
  - target_slug: ""               # 예: "realestate/jeonse-deposit-protection"
    anchor_text: ""               # 예: "전세보증금 보호 절차"
    placement: ""                 # 예: "결론 직전, '한 줄 정리' 다음"

# ─────────────────────────────────────────────
# 검증·운영
# ─────────────────────────────────────────────
verification:
  data_basis_date: ""        # YYYY-MM-DD (이 brief 의 수치·요율 기준일)
  next_review_date: ""       # YYYY-MM-DD (보통 6개월 후)
  ymyl_disclaimer: true      # YMYL 면책 명시 의무
  ai_assistance_disclosure: true  # AI 사용 공시 의무

# ─────────────────────────────────────────────
# AdSense 정책 사전 검사
# ─────────────────────────────────────────────
ad_policy:
  promotes_specific_loan: false               # 특정 대출 상품 직접 홍보 금지
  contains_high_interest_loan_promotion: false # 고금리 대출 홍보 금지
  contains_financial_advice: false            # 개인 맞춤 자문 X (정보 제공만)
  google_compliant: true                      # AdSense 정책 위반 사전 점검

# ─────────────────────────────────────────────
# 발행 후 성과 평가 기준
# ─────────────────────────────────────────────
success_metric:
  target_pv_30d: 500                 # 30일 페이지뷰 목표
  target_avg_dwell_seconds: 120      # 평균 체류시간 목표 (초)
  target_search_impressions_30d: 3000  # 검색 노출 목표
  target_indexed_within_days: 3      # 색인 도달 목표 일수
  if_underperform: "review-and-update"  # review-and-update | rewrite | noindex | delete

# ─────────────────────────────────────────────
# 발행 후 갱신 이력 (시스템이 자동 채움)
# 사람이 수동 편집 X
# ─────────────────────────────────────────────
update_log: []
