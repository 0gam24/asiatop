name: Naver Gap Queue (빈틈 대기열 매일 갱신)

# 2026-09-28 운영자 지시 "글감은 오늘 빈틈 키워드를 찾아서 자동 발행하도록".
# 매일 KST 01:17 에 공식 네이버 API(HUB)로 빈틈 대기열을 새로 재서 main 에 커밋한다.
# KST 03:05 클라우드 루틴(02 Asiatop)이 이 대기열에서 신규 글 1편을 고른다 — 루틴은 읽기만 한다.
#
# - 쓰는 파일: docs/ops/pipeline-queue.json · docs/ops/DAILY-KEYWORDS.md · docs/ops/radar/pipeline-seen.json (사이트 빌드와 무관)
# - 커밋 메시지의 [CF-Pages-Skip] 으로 Cloudflare Pages 빌드를 건너뛴다 (빌드 큐 동시 1건 보호)
# - 측정 실패(인증·네트워크)면 커밋 없이 잡이 실패한다 → 루틴은 오늘 측정분이 없으므로 신규 0편
# - search.naver.com 수집 없음. 공식 API 만 (scripts/audit/naver-pipeline.mjs)

on:
  schedule:
    - cron: '17 16 * * *' # UTC 16:17 = KST 01:17 daily (정각 혼잡 회피, 루틴 KST 03:05 보다 약 1시간 50분 앞)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: naver-queue-daily
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  refresh-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 의존성 없음 (node 내장 모듈만) — pnpm install 불필요
      - name: Measure gap queue (official Naver API)
        env:
          X_NCP_APIGW_API_KEY_ID: ${{ secrets.X_NCP_APIGW_API_KEY_ID }}
          X_NCP_APIGW_API_KEY: ${{ secrets.X_NCP_APIGW_API_KEY }}
        run: node scripts/audit/naver-pipeline.mjs --write

      - name: Commit queue to main
        run: |
          git config user.name "moneylook-naver-queue"
          git config user.email "auto@moneylook"
          git add docs/ops/pipeline-queue.json docs/ops/DAILY-KEYWORDS.md docs/ops/radar/pipeline-seen.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          KST=$(TZ=Asia/Seoul date +"%Y-%m-%d")
          git commit -m "chore(queue): 빈틈 대기열 자동 갱신 ${KST} [CF-Pages-Skip]"
          for _ in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 10
          done
          echo "::error::대기열 커밋 push 실패"
          exit 1
