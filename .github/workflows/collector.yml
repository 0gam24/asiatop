name: Collector (지식인 → pending 큐 적재)

# R95-1 — auto-publish 30분 전(KST 05:30) cron 으로 큐 적재.
# 흐름:
#   1. Naver 지식인 search (NAVER_CLIENT_ID 없으면 fail-closed)
#   2. 12 cluster × 1 keyword sample → 후보 수집
#   3. 기존 360편 dedup → unmet_market_score 상위 N건 선정
#   4. briefs/_pool/_pending/<hash>.txt 적재 → 자동 commit/push
#   5. KST 06:00 auto-publish.yml 가 큐 픽업 → 발행

on:
  schedule:
    - cron: '30 20 * * *'   # KST 05:30 (UTC 20:30 전날)
  workflow_dispatch:
    inputs:
      limit:
        description: '적재할 질문 수 (기본 2, 큐 상한 5)'
        required: false
        default: '2'
      dry_run:
        description: 'true면 적재 X, 후보 출력만'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  authorize:
    name: 호출자 권한 검증
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      github.actor == github.repository_owner ||
      contains(fromJSON(vars.AUTO_PUBLISH_ALLOWED_ACTORS || '["0gam24"]'), github.actor)
    steps:
      - run: echo "✅ actor=${{ github.actor }} event=${{ github.event_name }}"

  collect:
    name: 큐 적재 (Naver kin → briefs/_pool/_pending)
    needs: authorize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: secrets 가드 (fail-closed)
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${NAVER_CLIENT_ID:-}" ] || [ -z "${NAVER_CLIENT_SECRET:-}" ]; then
            echo "::error::NAVER_CLIENT_ID/SECRET secrets 미설정. Settings → Secrets → Actions 에서 등록 필요."
            exit 1
          fi
          echo "✅ NAVER secrets present"

      - name: 큐 적재 실행
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          LIMIT="${{ inputs.limit || '2' }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN=1 node scripts/collect-questions.mjs --limit "$LIMIT"
          else
            node scripts/collect-questions.mjs --limit "$LIMIT"
          fi

      - name: pending 큐 변경 commit
        if: inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 적재된 파일 확인 (untracked + modified 모두 검사)
          NEW_FILES=$(git status --porcelain briefs/_pool/_pending/ | wc -l)
          if [ "$NEW_FILES" = "0" ]; then
            echo "::notice::큐 변경 없음 (적재 0건 또는 모두 dedup)"
            exit 0
          fi

          git add briefs/_pool/_pending/
          git commit -m "chore(collector): $(date -u +%Y-%m-%d) 큐 적재 ${NEW_FILES}건"
          git push
          echo "::notice::pending 큐 ${NEW_FILES}건 적재 → push"
