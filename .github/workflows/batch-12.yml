name: Batch Publish 12 Articles (yolo)

# 운영자 yolo 모드 — 카테고리별 1편씩 batch 생성.
# article-pipeline.mjs --topic --cluster --slug (legacy 모드, G4 fact-verifier 우회).
# PASS 1 (DeepSeek 초안) → PASS 2 (정규화) → PASS 3 (Claude 자연화) → PASS 4 (Zod/GEO 게이트).
# SEO/GEO 양식 (TLDR + H2 7~9 + FAQ + 출처 인라인) 시스템 프롬프트로 강제.
#
# 비용: ~$0.22 (편당 ~$0.018 × 12)
# 시간: ~10분 (편당 ~50초)
#
# 안전망:
# - --slug 명시 → 기존 파일 충돌 시 article-pipeline 이 exit (덮어쓰기 X)
# - 12편 중 일부 게이트 fail 시 _drafts/<slug>.mdx 저장 (정식 위치 안 함)
# - 새 파일 0건이면 PR 생성 안 함

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  batch:
    name: 12 카테고리 batch 생성
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.actor == github.repository_owner
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MOCK_AUTHORITY: '1'
      AI_LIKENESS_THRESHOLD: '7.0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 12 토픽 article-pipeline 순차 실행
        id: gen
        run: |
          set +e
          # Round 7 (180 → 192편) — R78 §15 GEO/SEO 자동 부착 첫 batch.
          declare -a topics=(
            "tax|월세 세액공제 — 총급여 7천만원 이하 무주택 직장인 환급액|monthly-rent-tax-credit-70m-non-owner"
            "realestate|주택임대차 보증금 인하 — 임대인 요청 가능 사례|jeonse-deposit-reduction-tenant-request"
            "unemployment|이직확인서 미발급 — 사업주 거부 시 대응|departure-confirmation-employer-refusal"
            "gov-support|국가장학금 소득 분위 — 9급·8급 차이와 자격|national-scholarship-income-tier-9-vs-8"
            "savings|예적금 풍차돌리기 — 1년 만기 분산 전략 손익|deposit-windmill-1year-staggered"
            "insurance-labor|육아기 근로시간 단축 — 통상임금 100% 보장 자격|childcare-reduced-hours-100percent"
            "auto|자동차 검사 미이행 과태료 + 부담금 누적 계산|car-inspection-missed-cumulative-fine"
            "public-services|건강검진 의무 미수검 과태료 — 직장인 자격과 면제|health-checkup-mandatory-fine-exemption"
            "office-tips|회식비 영수증 — 회사 비용 처리와 개인 환급 차이|meal-expense-receipt-tax-treatment"
            "credit-loan|학자금 대출 상환 — 소득 연계 vs 일반 상환 비교|student-loan-income-contingent-vs-fixed"
            "insurance-personal|뇌혈관·심혈관 진단비 보험 — 가입 전 체크포인트|cerebrovascular-cardiovascular-checkup-coverage"
            "pension|개인형 IRP 중도 인출 — 사유와 세금 폭탄 회피|irp-mid-withdrawal-tax-avoidance"
          )
          success=0
          fail=0
          for entry in "${topics[@]}"; do
            IFS='|' read -r cluster topic slug <<< "$entry"
            echo "::group::[$cluster] ${slug}"
            node scripts/article-pipeline.mjs --topic "$topic" --cluster "$cluster" --slug "$slug"
            rc=$?
            if [ "$rc" -eq 0 ]; then
              success=$((success + 1))
            else
              fail=$((fail + 1))
              echo "::warning::article-pipeline exit ${rc} for ${slug} (cluster ${cluster})"
            fi
            echo "::endgroup::"
          done
          echo "success=$success" >> "$GITHUB_OUTPUT"
          echo "fail=$fail" >> "$GITHUB_OUTPUT"
          echo "::notice::batch 결과 — 성공 ${success}편 / 실패 ${fail}편"

      - name: 생성된 파일 list
        id: list
        run: |
          # 정식 위치(_drafts 아님) 신규 mdx 만 카운트
          mapfile -t new_files < <(git ls-files --others --exclude-standard src/content/articles/ | grep -v '_drafts/' || true)
          mapfile -t new_drafts < <(git ls-files --others --exclude-standard src/content/articles/_drafts/ || true)
          echo "정식 위치 새 파일: ${#new_files[@]}편"
          for f in "${new_files[@]}"; do echo "  $f"; done
          echo "_drafts/ 새 파일: ${#new_drafts[@]}편"
          for f in "${new_drafts[@]}"; do echo "  $f"; done
          echo "files_count=${#new_files[@]}" >> "$GITHUB_OUTPUT"
          echo "drafts_count=${#new_drafts[@]}" >> "$GITHUB_OUTPUT"

      - name: PR 생성 (정식 위치 파일 있을 때만)
        if: steps.list.outputs.files_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="batch-12/$(date +%Y%m%d-%H%M%S)"
          git config user.name "moneylook-auto"
          git config user.email "auto@moneylook"
          git checkout -b "$branch"
          git add src/content/articles/
          # _drafts 도 포함 (운영자가 PR 에서 보고 결정)
          git commit -m "feat: batch 12 articles — 카테고리별 1편씩 (yolo 모드)"
          git push -u origin "$branch"
          body_file=$(mktemp)
          {
            echo "## yolo 모드 batch — 12 카테고리 × 1편"
            echo ""
            echo "- LLM 4-pass (DeepSeek + Claude) 통과"
            echo "- PASS 4 (Zod/GEO 게이트) 통과 글: ${{ steps.gen.outputs.success }}편"
            echo "- PASS 4 fail (→ _drafts/) 글: ${{ steps.gen.outputs.fail }}편"
            echo "- G4 fact-verifier 우회 (legacy 모드)"
            echo ""
            echo "## 향후 30편 균등 path"
            echo ""
            echo "본 PR 머지 후 카테고리당 1편씩 += 1 (180 → 192편). 30편 균등 (360편) 까지 14 batch 더 필요. R78 §15 GEO/SEO 자동 부착 첫 batch."
          } > "$body_file"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "feat: batch 12 articles — 카테고리별 +1편 (yolo)" \
            --body-file "$body_file" \
            --label auto-publish
