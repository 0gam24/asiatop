name: Batch Publish 12 Articles (yolo)

# 운영자 yolo 모드 — 카테고리별 1편씩 batch 생성.
# article-pipeline.mjs --topic --cluster --slug (legacy 모드, G4 fact-verifier 우회).
# PASS 1 (DeepSeek 초안) → PASS 2 (정규화) → PASS 3 (Claude 자연화) → PASS 4 (Zod/GEO 게이트).
# SEO/GEO 양식 (TLDR + H2 7~9 + FAQ + 출처 인라인) 시스템 프롬프트로 강제.
#
# 비용: ~$0.22 (편당 ~$0.018 × 12)
# 시간: ~10분 (편당 ~50초)
#
# 안전망:
# - --slug 명시 → 기존 파일 충돌 시 article-pipeline 이 exit (덮어쓰기 X)
# - 12편 중 일부 게이트 fail 시 _drafts/<slug>.mdx 저장 (정식 위치 안 함)
# - 새 파일 0건이면 PR 생성 안 함

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  batch:
    name: 12 카테고리 batch 생성
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.actor == github.repository_owner
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MOCK_AUTHORITY: '1'
      AI_LIKENESS_THRESHOLD: '7.0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 12 토픽 article-pipeline 순차 실행
        id: gen
        run: |
          set +e
          # Round 20 (336 → 348편) — 마지막에서 두 번째. 기존 336편 중복 없음.
          declare -a topics=(
            "tax|연말정산 환급 시기 — 2월 회사 처리 vs 5월 종소세|year-end-refund-feb-vs-may"
            "realestate|주택임대사업자 — 의무 사항과 세제 혜택 손익|housing-rental-business-obligations-benefits"
            "unemployment|구직급여 수급 중 해외 출국 — 신고 의무와 정지|unemployment-overseas-travel-report"
            "gov-support|국민내일배움카드 — 직업훈련 한도 + 자비 부담|tomorrow-learning-card-budget-self-cost"
            "savings|연금저축 보험 vs 펀드 vs 은행 — 3사 비교|pension-savings-insurance-fund-bank"
            "insurance-labor|국민건강보험 부정수급 — 신고와 환수 절차|nhis-fraud-report-recovery"
            "auto|렌터카 보험 — 종합·자차·면책금 조합 비교|rental-car-insurance-comprehensive-self-deduction"
            "public-services|증명서 발급 한도 — 무료 vs 유료 + 발급 위치|certificate-issuance-free-vs-paid"
            "office-tips|퇴직금 산정 — 3개월 평균임금 vs 통상임금|severance-3month-average-vs-ordinary"
            "credit-loan|대출 신용조회 — 하드 vs 소프트 + 신용점수 영향|credit-inquiry-hard-vs-soft-score"
            "insurance-personal|건강증진 보험 — 보험료 할인 + 만보 챌린지|health-promotion-insurance-discount-steps"
            "pension|퇴직연금 DC 운용 — 채권형 vs 주식형 손익 분기|dc-retirement-bond-vs-equity-breakeven"
          )
          success=0
          fail=0
          for entry in "${topics[@]}"; do
            IFS='|' read -r cluster topic slug <<< "$entry"
            echo "::group::[$cluster] ${slug}"
            node scripts/article-pipeline.mjs --topic "$topic" --cluster "$cluster" --slug "$slug"
            rc=$?
            if [ "$rc" -eq 0 ]; then
              success=$((success + 1))
            else
              fail=$((fail + 1))
              echo "::warning::article-pipeline exit ${rc} for ${slug} (cluster ${cluster})"
            fi
            echo "::endgroup::"
          done
          echo "success=$success" >> "$GITHUB_OUTPUT"
          echo "fail=$fail" >> "$GITHUB_OUTPUT"
          echo "::notice::batch 결과 — 성공 ${success}편 / 실패 ${fail}편"

      - name: 생성된 파일 list
        id: list
        run: |
          # 정식 위치(_drafts 아님) 신규 mdx 만 카운트
          mapfile -t new_files < <(git ls-files --others --exclude-standard src/content/articles/ | grep -v '_drafts/' || true)
          mapfile -t new_drafts < <(git ls-files --others --exclude-standard src/content/articles/_drafts/ || true)
          echo "정식 위치 새 파일: ${#new_files[@]}편"
          for f in "${new_files[@]}"; do echo "  $f"; done
          echo "_drafts/ 새 파일: ${#new_drafts[@]}편"
          for f in "${new_drafts[@]}"; do echo "  $f"; done
          echo "files_count=${#new_files[@]}" >> "$GITHUB_OUTPUT"
          echo "drafts_count=${#new_drafts[@]}" >> "$GITHUB_OUTPUT"

      - name: PR 생성 (정식 위치 파일 있을 때만)
        if: steps.list.outputs.files_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="batch-12/$(date +%Y%m%d-%H%M%S)"
          git config user.name "moneylook-auto"
          git config user.email "auto@moneylook"
          git checkout -b "$branch"
          git add src/content/articles/
          # _drafts 도 포함 (운영자가 PR 에서 보고 결정)
          git commit -m "feat: batch 12 articles — 카테고리별 1편씩 (yolo 모드)"
          git push -u origin "$branch"
          body_file=$(mktemp)
          {
            echo "## yolo 모드 batch — 12 카테고리 × 1편"
            echo ""
            echo "- LLM 4-pass (DeepSeek + Claude) 통과"
            echo "- PASS 4 (Zod/GEO 게이트) 통과 글: ${{ steps.gen.outputs.success }}편"
            echo "- PASS 4 fail (→ _drafts/) 글: ${{ steps.gen.outputs.fail }}편"
            echo "- G4 fact-verifier 우회 (legacy 모드)"
            echo ""
            echo "## 향후 30편 균등 path"
            echo ""
            echo "본 PR 머지 후 카테고리당 1편씩 += 1 (336 → 348편). 30편 균등 (360편) 까지 1 batch 더 필요."
          } > "$body_file"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "feat: batch 12 articles — 카테고리별 +1편 (yolo)" \
            --body-file "$body_file" \
            --label auto-publish
