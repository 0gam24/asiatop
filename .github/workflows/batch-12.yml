name: Batch Publish 12 Articles (yolo)

# 운영자 yolo 모드 — 카테고리별 1편씩 batch 생성.
# article-pipeline.mjs --topic --cluster --slug (legacy 모드, G4 fact-verifier 우회).
# PASS 1 (DeepSeek 초안) → PASS 2 (정규화) → PASS 3 (Claude 자연화) → PASS 4 (Zod/GEO 게이트).
# SEO/GEO 양식 (TLDR + H2 7~9 + FAQ + 출처 인라인) 시스템 프롬프트로 강제.
#
# 비용: ~$0.22 (편당 ~$0.018 × 12)
# 시간: ~10분 (편당 ~50초)
#
# 안전망:
# - --slug 명시 → 기존 파일 충돌 시 article-pipeline 이 exit (덮어쓰기 X)
# - 12편 중 일부 게이트 fail 시 _drafts/<slug>.mdx 저장 (정식 위치 안 함)
# - 새 파일 0건이면 PR 생성 안 함

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  batch:
    name: 12 카테고리 batch 생성
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.actor == github.repository_owner
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MOCK_AUTHORITY: '1'
      AI_LIKENESS_THRESHOLD: '7.0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 12 토픽 article-pipeline 순차 실행
        id: gen
        run: |
          set +e
          # Round 5 (156 → 168편) — 기존 156편 중복 없음.
          declare -a topics=(
            "tax|부동산 임대소득 — 종합과세 vs 분리과세 손익 분기점|rental-income-comprehensive-vs-separate"
            "realestate|청약 가점제 부양가족 점수 — 등본 정리 + 점수 계산|subscription-points-family-dependents"
            "unemployment|6개월 미만 단기 근로 — 실업급여 자격 요건 정리|short-term-worker-unemployment-eligibility"
            "gov-support|청년 주거지원 한도와 자격 — 월세지원·디딤돌·버팀목 비교|youth-housing-support-limits-2026"
            "savings|청년희망적금 만기 후 청년도약계좌 환승 — 자격과 한도|hope-savings-leap-account-rollover"
            "insurance-labor|산재 사망 사고 유족급여 — 신청 자격과 지급액 계산|workers-comp-death-survivor-benefit"
            "auto|자동차 폐차 환경개선부담금 환급 — 자격과 절차|car-disposal-environment-fee-refund"
            "public-services|도로명 주소 변경 신청 — 자동 갱신 안 되는 서류 정리|road-name-address-change"
            "office-tips|출산휴가 + 육아휴직 급여 — 통상임금 100% vs 80% 차이|maternity-childcare-pay-comparison"
            "credit-loan|청년 전세보증금 반환 보증 — HUG 가입 자격과 보증료|youth-jeonse-deposit-return-hug"
            "insurance-personal|어린이 보험 — 4세대 실손 vs 종전 보장 차이|kids-insurance-4gen-vs-prev"
            "pension|국민연금 분할연금 — 이혼 시 배우자 수령 자격|nps-divorce-split-pension"
          )
          success=0
          fail=0
          for entry in "${topics[@]}"; do
            IFS='|' read -r cluster topic slug <<< "$entry"
            echo "::group::[$cluster] ${slug}"
            node scripts/article-pipeline.mjs --topic "$topic" --cluster "$cluster" --slug "$slug"
            rc=$?
            if [ "$rc" -eq 0 ]; then
              success=$((success + 1))
            else
              fail=$((fail + 1))
              echo "::warning::article-pipeline exit ${rc} for ${slug} (cluster ${cluster})"
            fi
            echo "::endgroup::"
          done
          echo "success=$success" >> "$GITHUB_OUTPUT"
          echo "fail=$fail" >> "$GITHUB_OUTPUT"
          echo "::notice::batch 결과 — 성공 ${success}편 / 실패 ${fail}편"

      - name: 생성된 파일 list
        id: list
        run: |
          # 정식 위치(_drafts 아님) 신규 mdx 만 카운트
          mapfile -t new_files < <(git ls-files --others --exclude-standard src/content/articles/ | grep -v '_drafts/' || true)
          mapfile -t new_drafts < <(git ls-files --others --exclude-standard src/content/articles/_drafts/ || true)
          echo "정식 위치 새 파일: ${#new_files[@]}편"
          for f in "${new_files[@]}"; do echo "  $f"; done
          echo "_drafts/ 새 파일: ${#new_drafts[@]}편"
          for f in "${new_drafts[@]}"; do echo "  $f"; done
          echo "files_count=${#new_files[@]}" >> "$GITHUB_OUTPUT"
          echo "drafts_count=${#new_drafts[@]}" >> "$GITHUB_OUTPUT"

      - name: PR 생성 (정식 위치 파일 있을 때만)
        if: steps.list.outputs.files_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="batch-12/$(date +%Y%m%d-%H%M%S)"
          git config user.name "moneylook-auto"
          git config user.email "auto@moneylook"
          git checkout -b "$branch"
          git add src/content/articles/
          # _drafts 도 포함 (운영자가 PR 에서 보고 결정)
          git commit -m "feat: batch 12 articles — 카테고리별 1편씩 (yolo 모드)"
          git push -u origin "$branch"
          body_file=$(mktemp)
          {
            echo "## yolo 모드 batch — 12 카테고리 × 1편"
            echo ""
            echo "- LLM 4-pass (DeepSeek + Claude) 통과"
            echo "- PASS 4 (Zod/GEO 게이트) 통과 글: ${{ steps.gen.outputs.success }}편"
            echo "- PASS 4 fail (→ _drafts/) 글: ${{ steps.gen.outputs.fail }}편"
            echo "- G4 fact-verifier 우회 (legacy 모드)"
            echo ""
            echo "## 향후 30편 균등 path"
            echo ""
            echo "본 PR 머지 후 카테고리당 1편씩 += 1 (156 → 168편). 30편 균등 (360편) 까지 16 batch 더 필요."
          } > "$body_file"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "feat: batch 12 articles — 카테고리별 +1편 (yolo)" \
            --body-file "$body_file" \
            --label auto-publish
