name: Batch Publish 12 Articles (yolo)

# 운영자 yolo 모드 — 카테고리별 1편씩 batch 생성.
# article-pipeline.mjs --topic --cluster --slug (legacy 모드, G4 fact-verifier 우회).
# PASS 1 (DeepSeek 초안) → PASS 2 (정규화) → PASS 3 (Claude 자연화) → PASS 4 (Zod/GEO 게이트).
# SEO/GEO 양식 (TLDR + H2 7~9 + FAQ + 출처 인라인) 시스템 프롬프트로 강제.
#
# 비용: ~$0.22 (편당 ~$0.018 × 12)
# 시간: ~10분 (편당 ~50초)
#
# 안전망:
# - --slug 명시 → 기존 파일 충돌 시 article-pipeline 이 exit (덮어쓰기 X)
# - 12편 중 일부 게이트 fail 시 _drafts/<slug>.mdx 저장 (정식 위치 안 함)
# - 새 파일 0건이면 PR 생성 안 함

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  batch:
    name: 12 카테고리 batch 생성
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.actor == github.repository_owner
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MOCK_AUTHORITY: '1'
      AI_LIKENESS_THRESHOLD: '7.0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 12 토픽 article-pipeline 순차 실행
        id: gen
        run: |
          set +e
          # Round 14 (264 → 276편) — 기존 264편 중복 없음.
          declare -a topics=(
            "tax|연말정산 부양가족 — 만 60세 부모님 인적공제 자격|year-end-tax-parent-60-dependent"
            "realestate|중도금 대출 — DSR 산정 + 후취담보 조건|interim-payment-loan-dsr-collateral"
            "unemployment|실업크레딧 — 국민연금 보험료 정부 지원|unemployment-credit-nps-government-support"
            "gov-support|차상위 본인부담 경감 — 의료급여 확장 자격|nearpoor-medical-fee-reduction"
            "savings|청년 우대형 청약통장 — 일반 vs 우대 손익|youth-housing-savings-preferential-vs-regular"
            "insurance-labor|산재 통상 vs 출퇴근 — 입증 책임과 보상 차이|workers-comp-routine-vs-commute"
            "auto|자동차세 자동이체 할인 — 분기·반기 신청 절차|car-tax-auto-debit-discount-application"
            "public-services|국민비서 카카오톡 알림 — 14종 행정 등록|kakao-civil-notification-14-types"
            "office-tips|퇴직 통보 — 1개월 전 vs 즉시 + 통상임금 차이|resignation-notice-1month-vs-immediate"
            "credit-loan|미소금융 vs 햇살론 — 자격·금리·한도 비교|misogeumyung-vs-sunshine-loan"
            "insurance-personal|입원일당 보험 — 정기·종신 차이와 가입 한도|hospitalization-daily-insurance-coverage"
            "pension|국민연금 노령연금 조기 vs 정상 — 손익분기점|nps-old-age-pension-early-vs-normal-breakeven"
          )
          success=0
          fail=0
          for entry in "${topics[@]}"; do
            IFS='|' read -r cluster topic slug <<< "$entry"
            echo "::group::[$cluster] ${slug}"
            node scripts/article-pipeline.mjs --topic "$topic" --cluster "$cluster" --slug "$slug"
            rc=$?
            if [ "$rc" -eq 0 ]; then
              success=$((success + 1))
            else
              fail=$((fail + 1))
              echo "::warning::article-pipeline exit ${rc} for ${slug} (cluster ${cluster})"
            fi
            echo "::endgroup::"
          done
          echo "success=$success" >> "$GITHUB_OUTPUT"
          echo "fail=$fail" >> "$GITHUB_OUTPUT"
          echo "::notice::batch 결과 — 성공 ${success}편 / 실패 ${fail}편"

      - name: 생성된 파일 list
        id: list
        run: |
          # 정식 위치(_drafts 아님) 신규 mdx 만 카운트
          mapfile -t new_files < <(git ls-files --others --exclude-standard src/content/articles/ | grep -v '_drafts/' || true)
          mapfile -t new_drafts < <(git ls-files --others --exclude-standard src/content/articles/_drafts/ || true)
          echo "정식 위치 새 파일: ${#new_files[@]}편"
          for f in "${new_files[@]}"; do echo "  $f"; done
          echo "_drafts/ 새 파일: ${#new_drafts[@]}편"
          for f in "${new_drafts[@]}"; do echo "  $f"; done
          echo "files_count=${#new_files[@]}" >> "$GITHUB_OUTPUT"
          echo "drafts_count=${#new_drafts[@]}" >> "$GITHUB_OUTPUT"

      - name: PR 생성 (정식 위치 파일 있을 때만)
        if: steps.list.outputs.files_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="batch-12/$(date +%Y%m%d-%H%M%S)"
          git config user.name "moneylook-auto"
          git config user.email "auto@moneylook"
          git checkout -b "$branch"
          git add src/content/articles/
          # _drafts 도 포함 (운영자가 PR 에서 보고 결정)
          git commit -m "feat: batch 12 articles — 카테고리별 1편씩 (yolo 모드)"
          git push -u origin "$branch"
          body_file=$(mktemp)
          {
            echo "## yolo 모드 batch — 12 카테고리 × 1편"
            echo ""
            echo "- LLM 4-pass (DeepSeek + Claude) 통과"
            echo "- PASS 4 (Zod/GEO 게이트) 통과 글: ${{ steps.gen.outputs.success }}편"
            echo "- PASS 4 fail (→ _drafts/) 글: ${{ steps.gen.outputs.fail }}편"
            echo "- G4 fact-verifier 우회 (legacy 모드)"
            echo ""
            echo "## 향후 30편 균등 path"
            echo ""
            echo "본 PR 머지 후 카테고리당 1편씩 += 1 (264 → 276편). 30편 균등 (360편) 까지 7 batch 더 필요."
          } > "$body_file"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "feat: batch 12 articles — 카테고리별 +1편 (yolo)" \
            --body-file "$body_file" \
            --label auto-publish
