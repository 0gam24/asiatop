name: Batch Publish 12 Articles (yolo)

# 운영자 yolo 모드 — 카테고리별 1편씩 batch 생성.
# article-pipeline.mjs --topic --cluster --slug (legacy 모드, G4 fact-verifier 우회).
# PASS 1 (DeepSeek 초안) → PASS 2 (정규화) → PASS 3 (Claude 자연화) → PASS 4 (Zod/GEO 게이트).
# SEO/GEO 양식 (TLDR + H2 7~9 + FAQ + 출처 인라인) 시스템 프롬프트로 강제.
#
# 비용: ~$0.22 (편당 ~$0.018 × 12)
# 시간: ~10분 (편당 ~50초)
#
# 안전망:
# - --slug 명시 → 기존 파일 충돌 시 article-pipeline 이 exit (덮어쓰기 X)
# - 12편 중 일부 게이트 fail 시 _drafts/<slug>.mdx 저장 (정식 위치 안 함)
# - 새 파일 0건이면 PR 생성 안 함

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  batch:
    name: 12 카테고리 batch 생성
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.actor == github.repository_owner
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MOCK_AUTHORITY: '1'
      AI_LIKENESS_THRESHOLD: '7.0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 12 토픽 article-pipeline 순차 실행
        id: gen
        run: |
          set +e
          # 카테고리|토픽|슬러그 (legacy 108편 중복 없음 — STRUCTURE.md §8 확인)
          declare -a topics=(
            "tax|2026년 연말정산 일정과 주요 변경 5가지|yearend-tax-2026-schedule-changes"
            "realestate|전세보증보험 가입 — HUG vs SGI 차이 완벽 비교|jeonse-guarantee-hug-vs-sgi-compare"
            "unemployment|권고사직 합의서 작성 시 챙길 5가지 권리|recommended-resignation-agreement-rights"
            "gov-support|청년 자산 형성 정책 3종 비교 — 도약·희망·내일|youth-asset-formation-3policy-compare"
            "savings|ISA 만기 후 연금저축 갈아타기 절세 전략|isa-maturity-pension-transfer-tax-saving"
            "insurance-labor|건강보험료 갑작스러운 인상 원인과 조정 신청법|health-insurance-premium-spike-adjustment"
            "auto|자동차 검사 미수검 과태료와 사후 정정 절차|car-inspection-miss-penalty-fix"
            "public-services|확정일자 받는 법 — 모바일 vs 주민센터 비교|lease-fixed-date-mobile-vs-office"
            "office-tips|회식·접대비 영수증 비과세 처리 기준 2026|meeting-expense-tax-exempt-2026"
            "credit-loan|신용점수 1년 안에 100점 올리는 5단계|credit-score-up-100-points-5-steps"
            "insurance-personal|4세대 실손보험 갈아타기 경제성 손익분기 계산|silson-4gen-transfer-breakeven-calc"
            "pension|국민연금 조기수령 손익분기점 계산|national-pension-early-receive-breakeven"
          )
          success=0
          fail=0
          for entry in "${topics[@]}"; do
            IFS='|' read -r cluster topic slug <<< "$entry"
            echo "::group::[$cluster] ${slug}"
            node scripts/article-pipeline.mjs --topic "$topic" --cluster "$cluster" --slug "$slug"
            rc=$?
            if [ "$rc" -eq 0 ]; then
              success=$((success + 1))
            else
              fail=$((fail + 1))
              echo "::warning::article-pipeline exit ${rc} for ${slug} (cluster ${cluster})"
            fi
            echo "::endgroup::"
          done
          echo "success=$success" >> "$GITHUB_OUTPUT"
          echo "fail=$fail" >> "$GITHUB_OUTPUT"
          echo "::notice::batch 결과 — 성공 ${success}편 / 실패 ${fail}편"

      - name: 생성된 파일 list
        id: list
        run: |
          # 정식 위치(_drafts 아님) 신규 mdx 만 카운트
          mapfile -t new_files < <(git ls-files --others --exclude-standard src/content/articles/ | grep -v '_drafts/' || true)
          mapfile -t new_drafts < <(git ls-files --others --exclude-standard src/content/articles/_drafts/ || true)
          echo "정식 위치 새 파일: ${#new_files[@]}편"
          for f in "${new_files[@]}"; do echo "  $f"; done
          echo "_drafts/ 새 파일: ${#new_drafts[@]}편"
          for f in "${new_drafts[@]}"; do echo "  $f"; done
          echo "files_count=${#new_files[@]}" >> "$GITHUB_OUTPUT"
          echo "drafts_count=${#new_drafts[@]}" >> "$GITHUB_OUTPUT"

      - name: PR 생성 (정식 위치 파일 있을 때만)
        if: steps.list.outputs.files_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="batch-12/$(date +%Y%m%d-%H%M%S)"
          git config user.name "moneylook-auto"
          git config user.email "auto@moneylook"
          git checkout -b "$branch"
          git add src/content/articles/
          # _drafts 도 포함 (운영자가 PR 에서 보고 결정)
          git commit -m "feat: batch 12 articles — 카테고리별 1편씩 (yolo 모드)"
          git push -u origin "$branch"
          body_file=$(mktemp)
          {
            echo "## yolo 모드 batch — 12 카테고리 × 1편"
            echo ""
            echo "- LLM 4-pass (DeepSeek + Claude) 통과"
            echo "- PASS 4 (Zod/GEO 게이트) 통과 글: ${{ steps.gen.outputs.success }}편"
            echo "- PASS 4 fail (→ _drafts/) 글: ${{ steps.gen.outputs.fail }}편"
            echo "- G4 fact-verifier 우회 (legacy 모드)"
            echo ""
            echo "## 향후 30편 균등 path"
            echo ""
            echo "본 PR 머지 후 카테고리당 1편씩 += 1 (108 → 120편). 30편 균등 (360편) 까지 18 batch 더 필요."
          } > "$body_file"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "feat: batch 12 articles — 카테고리별 +1편 (yolo)" \
            --body-file "$body_file" \
            --label auto-publish
