name: Scheduled Rebuild (CF Deploy Hook)

on:
  schedule:
    # R53 cron 분산 — 6시간마다 15분 offset (UTC 00:15·06:15·12:15·18:15 = KST 09:15·15:15·21:15·03:15).
    # security-audit·stale-content-check (UTC 17·19 일요일) 과 분리.
    - cron: '15 */6 * * *'
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"   # R95-9 — Node 20 deprecation 회피 (2026-09-16 강제 전환 전)

jobs:
  trigger-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages Deploy Hook
        run: |
          if [ -z "${{ secrets.CF_DEPLOY_HOOK }}" ]; then
            echo "::warning::CF_DEPLOY_HOOK secret not set — skipping rebuild trigger."
            exit 0
          fi
          curl -X POST "${{ secrets.CF_DEPLOY_HOOK }}"
          echo "✅ Cloudflare Pages rebuild triggered."
