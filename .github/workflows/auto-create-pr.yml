name: Auto Create PR

# push 시 자동으로 PR 생성 (PR 자체가 없을 때만).
# 사용자 부담: branch push 후 PR 생성 클릭 X.
# 후속: 운영자가 "merge-approved" 라벨을 붙이면 auto-merge.yml 이 enable →
#   CI green 시 자동 squash merge (2026-08-26 opt-in 전환 — 라벨 없으면 머지 안 됨).
#
# 이 워크플로는 라벨을 붙이지 않는다. 머지 게이트는 오직 운영자의 "merge-approved" 라벨이다.
#
# 2026-09-09 — 리포 설정 "Allow GitHub Actions to create and approve pull requests" 가 꺼져 있으면
#   gh pr create 가 GraphQL 거부로 죽어 브랜치를 푸시할 때마다 빨간 X 가 남았다 (2026-09-02 ~ 09-09).
#   설정을 다시 켜서 해결했지만, GitHub 이 기본값을 바꾸거나 조직 정책이 다시 끄는 일이 언제든 생긴다.
#   그때 CI 를 실패로 물들이는 대신 무엇을 켜야 하는지 알려주는 경고만 남기고 통과시킨다.
#   PR 자동 생성은 편의 기능이지 게이트가 아니므로, 실패해도 브랜치 푸시 자체는 이미 끝나 있다.

on:
  push:
    branches:
      - 'fix/**'
      - 'feat/**'
      - 'chore/**'
      - 'docs/**'
      - 'refactor/**'
      - 'perf/**'
      - 'test/**'

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"   # R95-9 — Node 20 deprecation 회피 (2026-09-16 강제 전환 전)

jobs:
  create-pr:
    name: Create PR for trusted authors
    runs-on: ubuntu-latest
    # 본인(repo owner) 또는 봇만 자동 PR 생성
    if: |
      github.actor == github.repository_owner ||
      endsWith(github.actor, '[bot]')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create PR if not exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # 이미 open PR 있으면 skip
          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$existing" -gt 0 ]; then
            echo "✅ PR already open for $BRANCH (skip)"
            exit 0
          fi

          # main 과 비교해서 변경 commit 있는지 확인
          ahead=$(git rev-list --count "origin/main..HEAD")
          if [ "$ahead" -eq 0 ]; then
            echo "::notice::No commits ahead of main. Skip PR creation."
            exit 0
          fi

          # 최신 commit 메시지를 PR 제목으로 (pipefail 아래에서 SIGPIPE 나지 않도록 파이프 없이 뽑는다)
          title=$(git log -1 --pretty=%s "origin/main..HEAD")
          if [ -z "$title" ]; then
            title="$(git log -1 --pretty=%s)"
          fi

          # body: ahead commit 목록 + auto 안내
          {
            echo "## Auto-created PR"
            echo ""
            echo "Push 트리거 자동 생성. 운영자가 \`merge-approved\` 라벨을 붙여야"
            echo "CI green 시 \`auto-merge.yml\` 이 자동 squash merge (라벨 없으면 대기)."
            echo ""
            echo "### Commits ($ahead)"
            git log -n 20 "origin/main..HEAD" --pretty=format:'- %s (%h)'
          } > /tmp/pr-body.md

          # 권한이 꺼져 있으면 실패가 아니라 경고로 끝낸다 (헤더 주석 참조)
          if out=$(gh pr create \
            --title "$title" \
            --body-file /tmp/pr-body.md \
            --base main \
            --head "$BRANCH" 2>&1); then
            printf '%s\n' "$out"
            echo "✅ Auto PR created for $BRANCH"
            exit 0
          fi

          printf '%s\n' "$out"
          if printf '%s' "$out" | grep -qiE 'not permitted to create or approve pull requests|Resource not accessible by integration'; then
            echo "::warning title=Auto PR 생성 건너뜀::Actions 에 PR 생성 권한이 없다. Settings → Actions → General → Workflow permissions 의 \"Allow GitHub Actions to create and approve pull requests\" 를 켜면 복구된다. 브랜치 푸시는 정상이므로 PR 만 수동으로 만들면 된다."
            exit 0
          fi

          echo "::error title=Auto PR 생성 실패::권한 문제가 아닌 오류다. 위 로그를 확인하라."
          exit 1
