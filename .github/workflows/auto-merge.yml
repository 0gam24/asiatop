name: Auto Merge

# PR 자동 머지 워크플로 — 2026-08-26 opt-in 전환 (구글 스팸 억제 회복 P0).
#
# 이전(opt-out): author 가 owner/bot 이고 draft 아니고 no-auto-merge 라벨이 없으면
#   CI green 시 즉시 자동 squash merge. 일 3~4편 기계적 발행 풋프린트의 마지막 고리였다.
# 현재(opt-in): 운영자가 "merge-approved" 라벨을 직접 붙인 PR 만 자동 머지 대상.
#   라벨 부착 = 사람의 발행 승인. Claude·봇·자동화는 이 라벨을 붙이지 않는다 (CLAUDE.md).
#
# 안전망 — 다음 모두 충족 시만 auto-merge 활성:
#   1. author = repo owner 또는 GitHub bot
#   2. draft 아님
#   3. "no-auto-merge" 라벨 없음 (긴급 정지 — merge-approved 보다 우선)
#   4. "merge-approved" 라벨 있음 (opt-in 게이트 — 운영자 수동 부착)
#   5. CI fail 시 머지 안 됨 (auto-merge 자체가 CI green 대기)
#
# 선행 조건 (1회 설정):
#   GitHub repo Settings → General → Pull Requests → "Allow auto-merge" 체크.
#   미설정 시 워크플로는 동작하지만 머지는 일어나지 않음 (no-op).

on:
  pull_request:
    # labeled 필수 — opt-in 게이트는 라벨 부착 시점에 발화해야 한다.
    types: [opened, reopened, ready_for_review, synchronize, labeled]

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"   # R95-9 — Node 20 deprecation 회피 (2026-09-16 강제 전환 전)

jobs:
  enable-auto-merge:
    name: Enable auto-merge for approved PRs
    runs-on: ubuntu-latest
    # 안전망 — 위 헤더 주석의 조건 1~4 전부 충족 시만 실행.
    if: |
      (github.event.pull_request.user.login == github.repository_owner ||
       github.event.pull_request.user.login == 'github-actions[bot]' ||
       endsWith(github.event.pull_request.user.login, '[bot]'))
      && github.event.pull_request.draft == false
      && !contains(github.event.pull_request.labels.*.name, 'no-auto-merge')
      && contains(github.event.pull_request.labels.*.name, 'merge-approved')
    steps:
      - name: Enable auto-merge (squash)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          echo "Enabling auto-merge for PR #${PR_NUMBER}: ${PR_TITLE}"
          # --auto 플래그: GitHub native auto-merge 활성. CI green 시 자동 squash merge.
          # --delete-branch: 머지 후 head 브랜치 자동 삭제.
          # --squash: 모든 commit을 1개로 squash (PR 단위 history 유지).
          gh pr merge "$PR_NUMBER" \
            --squash \
            --auto \
            --delete-branch \
            --repo "${{ github.repository }}" \
          || {
            echo "::warning::auto-merge enable 실패. Settings → 'Allow auto-merge' 활성 또는 권한 확인."
            exit 0
          }
          echo "✅ Auto-merge enabled — merge-approved 라벨 확인됨, CI green 시 자동 squash merge"
