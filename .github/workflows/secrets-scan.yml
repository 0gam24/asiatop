name: Secrets Scan

# 다중 방어선 — 마지막 안전망
# 1차: pre-commit hook (로컬, 커밋 시점)
# 2차: 본 워크플로 (GitHub, push·PR 시점)
#
# 도구:
#  - gitleaks: 업계 표준 시크릿 스캐너 (300+ 패턴)
#  - 자체 스크립트: 한국 공공·금융 키 패턴 (data.go.kr·BOK 등)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 매주 월요일 KST 03:00 (UTC 일요일 18:00) — 정기 점검
    - cron: '0 18 * * 0'
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write   # 결과를 Security 탭에 게시
  pull-requests: write     # gitleaks-action이 PR commits API + PR 코멘트 작성용 (403 방지)
  issues: write            # gitleaks-action이 issue 코멘트 fallback용

jobs:
  gitleaks:
    name: Gitleaks (300+ industry patterns)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 전체 히스토리 스캔

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE는 organization repo만 필요. Personal repo 무료
          GITLEAKS_ENABLE_COMMENTS: 'true'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'true'

  custom-scan:
    name: 한국 공공·금융 키 패턴 추가 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 자체 시크릿 스캐너 실행
        run: node scripts/secrets-scan.mjs

  history-check:
    name: 과거 커밋 히스토리 시크릿 점검
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 모든 커밋 시크릿 검색
        run: |
          # 모든 커밋의 변경 내역에서 시크릿 패턴 검사
          PATTERNS=(
            'AKIA[0-9A-Z]{16}'
            'AIza[0-9A-Za-z_-]{35}'
            'gh[pousr]_[A-Za-z0-9_]{36,}'
            'sk-ant-api[0-9]{2}-[A-Za-z0-9_-]{80,}'
            'sk-[A-Za-z0-9]{48,}'
            'webhooks/deploy_hooks/[a-f0-9-]{36}'
          )
          FAIL=0
          for p in "${PATTERNS[@]}"; do
            if git log -p --all | grep -EnH "$p" | head -5 | grep -q "."; then
              echo "::error::과거 커밋에 시크릿 패턴 발견: $p"
              FAIL=1
            fi
          done

          if [ "$FAIL" = "1" ]; then
            echo "::error::📋 처리 절차:"
            echo "::error::1. 노출된 키 즉시 폐기·재발급 (각 발급기관에서)"
            echo "::error::2. git filter-branch 또는 BFG로 히스토리에서 제거"
            echo "::error::3. force push (협업자 X 시 안전)"
            exit 1
          fi
          echo "✅ 히스토리 클린"
