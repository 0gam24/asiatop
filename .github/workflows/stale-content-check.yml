name: Stale Content Check

on:
  schedule:
    # 매주 월요일 오전 4시 KST (UTC 일 19:00).
    # R53 cron 분산 — security-audit (월 KST 02:00) 과 분리.
    - cron: '0 19 * * 0'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check-stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run frontmatter coverage audit (R53 #8)
        # 기존 inline 스크립트 → scripts/audit/frontmatter-coverage.mjs 통합.
        # 더 풍부한 메트릭(자동검증 메타 도입률·갱신 우선순위 큐 score) + 단일 진실.
        id: scan
        run: |
          node scripts/audit/frontmatter-coverage.mjs --json > /dev/null
          test -f dist/audit/frontmatter-coverage.json || {
            echo "audit JSON 생성 실패" >&2
            exit 1
          }
          node -e '
            const j = JSON.parse(require("fs").readFileSync("dist/audit/frontmatter-coverage.json","utf-8"));
            console.log("stale_count="+j.stale);
            console.log("very_stale_count="+j.veryStale);
            console.log("total="+j.total);
          ' >> "$GITHUB_OUTPUT"

      - name: Create or update tracking issue
        if: steps.scan.outputs.stale_count != '0' || steps.scan.outputs.very_stale_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('dist/audit/frontmatter-coverage.json', 'utf-8'));

            const today = new Date().toISOString().slice(0, 10);
            const title = `[자동] 갱신 필요 글 ${summary.stale}건 / Very stale ${summary.veryStale}건 (${today})`;

            const queue = summary.topPriority ?? [];
            const stalePriority = queue.filter((q) => q.age >= 180);

            let body = `## 갱신 필요 글 자동 점검 (${today})\n\n`;
            body += `### 전체 통계\n`;
            body += `- 총 글: **${summary.total}편**\n`;
            body += `- Stale (180일+): **${summary.stale}편**\n`;
            body += `- Very stale (360일+): **${summary.veryStale}편**\n\n`;

            body += `### 자동검증 메타 도입률\n`;
            const fc = summary.fieldCoverage ?? {};
            for (const [k, v] of Object.entries(fc)) {
              const pct = summary.total > 0 ? Math.round((v / summary.total) * 100) : 0;
              body += `- \`${k}\`: ${pct}% (${v}/${summary.total})\n`;
            }
            body += `\n`;

            if (stalePriority.length > 0) {
              body += `### Stale 글 우선순위 큐\n`;
              body += `score · age · flags · cluster/slug\n\n`;
              body += stalePriority.slice(0, 30).map((q) => {
                const age = q.age >= 360 ? `⚠️ ${q.age}d` : `🕐 ${q.age}d`;
                const flags = ['aiAssisted','sources_verified','lastReviewed','reviewedBy','fact_verification_at']
                  .map((f) => (q.has?.[f] ? '✓' : '·')).join('');
                return `- \`${String(q.score).padStart(3)}\` · ${age} · [${flags}] \`${q.cluster}/${q.slug}\``;
              }).join('\n');
              if (stalePriority.length > 30) body += `\n- ... and ${stalePriority.length - 30} more`;
              body += `\n\n`;
            }

            body += `### 권장 조치\n`;
            body += `1. **정책·요율·법령 변경 검토** ([data.go.kr](https://www.data.go.kr) / [law.go.kr](https://www.law.go.kr) / 홈택스)\n`;
            body += `2. 변경 발견 시 본문 수정 + frontmatter \`updatedAt\` 갱신\n`;
            body += `3. 변경 없음 확인 시 \`dataValidAsOf\` 만 갱신 (신선도 신호)\n`;
            body += `4. 자동검증 시스템 통과한 새 글에는 \`sources_verified: true\`, \`fact_verification_at\`, \`reviewedBy: moneylook-auto\` 메타 자동 부착\n\n`;
            body += `_본 이슈는 매주 월요일 KST 04:00 자동 갱신·생성됩니다._\n`;
            body += `_audit 로직: \`scripts/audit/frontmatter-coverage.mjs\` (SSoT)_`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'stale-content,automated',
            });

            if (issues.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                title,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['stale-content', 'automated', 'content'],
              });
            }
