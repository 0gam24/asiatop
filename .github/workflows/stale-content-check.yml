name: Stale Content Check

on:
  schedule:
    # 매주 월요일 오전 9시 KST (UTC 0시)
    - cron: '0 0 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check-stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find stale articles (180+ days)
        id: scan
        run: |
          node <<'EOF'
          const fs = require('fs');
          const path = require('path');

          const dir = 'src/content/articles';
          const files = fs.readdirSync(dir).filter(f => /\.mdx?$/.test(f));
          const now = Date.now();
          const STALE_DAYS = 180;
          const VERY_STALE_DAYS = 365;
          const stale = [];

          for (const file of files) {
            const content = fs.readFileSync(path.join(dir, file), 'utf-8');
            const fm = content.split('---')[1] ?? '';
            const get = (k) => {
              const m = fm.match(new RegExp(`^${k}:\\s*(.+)$`, 'm'));
              return m ? m[1].trim() : null;
            };
            const updated = get('updatedAt') ?? get('publishedAt');
            if (!updated) continue;
            const date = new Date(updated);
            const days = Math.floor((now - date.valueOf()) / 86400000);
            if (days > STALE_DAYS) {
              stale.push({
                file,
                title: get('title')?.replace(/^["']|["']$/g, '') ?? file,
                cluster: get('cluster')?.replace(/^["']|["']$/g, '') ?? 'unknown',
                days,
                veryStale: days > VERY_STALE_DAYS,
              });
            }
          }

          stale.sort((a, b) => b.days - a.days);
          console.log(`Found ${stale.length} stale articles`);
          fs.writeFileSync('stale.json', JSON.stringify(stale, null, 2));
          EOF
          echo "count=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("stale.json","utf-8")).length)')" >> $GITHUB_OUTPUT

      - name: Create or update tracking issue
        if: steps.scan.outputs.count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const stale = JSON.parse(fs.readFileSync('stale.json', 'utf-8'));
            if (stale.length === 0) return;

            const today = new Date().toISOString().slice(0, 10);
            const veryStaleCount = stale.filter(s => s.veryStale).length;
            const title = `[자동] 갱신 필요 글 ${stale.length}건 (${today})`;

            let body = `## 갱신 필요 글 자동 점검 (${today})\n\n`;
            body += `- 총 **${stale.length}건** 갱신 필요\n`;
            body += `- 1년 이상 지난 글: **${veryStaleCount}건**\n\n`;
            body += `## 우선순위\n\n`;
            body += stale.map(s => {
              const icon = s.veryStale ? '⚠️' : '🕐';
              return `- ${icon} **${s.title}** (\`${s.cluster}/${s.file}\`) — ${s.days}일 경과`;
            }).join('\n');
            body += `\n\n## 권장 조치\n\n`;
            body += `1. 정부 정책·요율·법령 변경 검토 ([data.go.kr](https://www.data.go.kr) / [law.go.kr](https://www.law.go.kr) / 홈택스)\n`;
            body += `2. 변경 발견 시 본문 수정 + frontmatter \`updatedAt\` 갱신\n`;
            body += `3. 변경 없음 확인 시 \`dataValidAsOf\`만 갱신하여 신선도 표시\n\n`;
            body += `_본 이슈는 매주 월요일 자동 생성됩니다. 새 점검 결과로 업데이트되거나 새 이슈가 생성됩니다._`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'stale-content,automated',
            });

            if (issues.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                title,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['stale-content', 'automated', 'content'],
              });
            }
