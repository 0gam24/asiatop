name: Auto PR Cleanup

# auto-publish 워크플로가 만든 PR 중 30분 내 CI 미통과 시 자동 close.
# AdSense·예산 보호 — 머지 안 되는 PR 누적 방지.

on:
  schedule:
    - cron: '15,45 * * * *'   # 매시 15·45분 — R53 cron 분산 (정각·30분 시작과 분리)
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"   # R95-9 — Node 20 deprecation 회피 (2026-09-16 강제 전환 전)

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 라벨 auto-publish PR 30분 timeout 검사·close
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOW=$(date -u +%s)
          gh pr list --label auto-publish --state open --json number,createdAt,statusCheckRollup --jq '.[]' | while IFS= read -r pr; do
            number=$(echo "$pr" | jq -r '.number')
            created=$(echo "$pr" | jq -r '.createdAt')
            checks=$(echo "$pr" | jq -r '.statusCheckRollup // []')
            CREATED_TS=$(date -u -d "$created" +%s)
            ELAPSED=$(( NOW - CREATED_TS ))

            # 30분 + CI failure → close
            FAILED=$(echo "$checks" | jq '[.[] | select(.conclusion == "FAILURE" or .conclusion == "TIMED_OUT")] | length')
            if [ "$ELAPSED" -ge 1800 ] && [ "$FAILED" -gt 0 ]; then
              echo "PR #$number: CI failed after ${ELAPSED}s → close + label auto-rejected"
              gh pr close "$number" --comment "CI 실패 후 30분 timeout — auto-publish 정책에 따라 close. 사유: status check failure" || true
              gh pr edit "$number" --add-label auto-rejected || true
            fi

            # 60분 + CI 결과 없음 → close (좀비 PR)
            if [ "$ELAPSED" -ge 3600 ] && [ "$(echo "$checks" | jq 'length')" = "0" ]; then
              echo "PR #$number: 60분 동안 CI 없음 → close + label auto-rejected"
              gh pr close "$number" --comment "60분 동안 CI 결과 없음 — close" || true
              gh pr edit "$number" --add-label auto-rejected || true
            fi
          done
