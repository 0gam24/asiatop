name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  workflow-lint:
    # actionlint — workflow YAML 정적 분석.
    # actor guard·fromJSON 파싱·셸 quoting 오타를 PR 단계에서 차단.
    # auto-publish.yml 의 if 표현식 1글자 오타가 권한 우회로 이어지지 않도록 fail-closed.
    name: Workflow YAML lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run actionlint
        # actionlint + shellcheck 통합 검증.
        # 본 게이트의 본 목적: actor guard if 표현식·fromJSON 파싱·트리거·permissions 오타 차단.
        # shellcheck SC* 룰도 활성 — quoting·ls|grep 등 워크플로 셸 회귀 차단.
        run: |
          set -euo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  unit:
    name: Unit + component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Vitest (unit + component)
        run: pnpm test

  build-test:
    name: Build + SSR sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec astro check

      - name: Build
        run: pnpm build

      - name: Verify SSR content (AI crawler visibility)
        run: |
          test -f dist/index.html
          test -f dist/tax/yearend-tax-2026-checklist/index.html
          grep -q "<h1" dist/index.html || (echo "❌ H1 missing in homepage" && exit 1)
          grep -q "application/ld+json" dist/index.html || (echo "❌ JSON-LD missing" && exit 1)
          test -f dist/robots.txt
          test -f dist/llms.txt
          test -f dist/rss.xml
          echo "✅ SSR content + SEO meta files present"

      - name: Validate Schema.org JSON-LD (Rich Results)
        # R47 P1-C — QAPage·ClaimReview 포함 9 type validator로 dist 전체 검증.
        # 깨진 JSON-LD 1건이라도 production 에 흘러가지 않도록 fail-closed.
        run: pnpm exec node scripts/validate-schema.mjs

      - name: Audit passage chunking (auto-published articles only)
        # R48 #48-5 — AI 답변 엔진 인용 청크 룰 검증.
        # --auto-only: aiAssisted=true 글에 한해 critical violation 시 fail.
        # 기존 사람 작성 글은 warn만 (점진 마이그레이션, 빌드 차단 X).
        run: pnpm exec node scripts/audit/passage-chunking.mjs --auto-only

      - name: Audit bundle size (R53 #3 budget gate)
        # JS raw 350KB / JS gz 120KB / CSS raw 80KB 임계.
        # 회귀 시 fail → React/Sentry/광고 chunk 폭증 사전 차단.
        run: pnpm exec node scripts/audit/bundle-size.mjs

      - name: Audit RSS·sitemap sync (R94-7 feed-sync gate)
        # article frontmatter 변경 시 RSS·sitemap-0·sitemap-news 동기화 검증.
        # 위반: updatedAt < publishedAt / sitemap URL 수 불일치 / RSS 빈 item / 최신 날짜 불일치.
        # fail-closed — 동기화 깨진 상태로 production 배포 차단.
        run: pnpm exec node scripts/audit/feed-sync.mjs

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm exec playwright test --project=chromium
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
