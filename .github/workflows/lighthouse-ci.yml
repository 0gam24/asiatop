name: Lighthouse CI

# R52: mobile job 제거 — collect.preset='perf' + assertions:categories:accessibility/seo
# 충돌(audit not run) 로 4회 연속 fail. desktop 만 측정 + production 점수는 PSI 실측.
# mobile 점수 가시성 필요 시 R53 에서 정공 fix(preset 변경 + assertions 단순화) 후 복구.

on:
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    name: lighthouse (desktop)
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm build

      - name: Run Lighthouse CI (desktop)
        run: pnpm dlx @lhci/cli@0.14.x autorun --config=./lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
