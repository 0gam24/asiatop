name: Lighthouse CI

on:
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        form_factor: [desktop, mobile]
    name: lighthouse (${{ matrix.form_factor }})
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm build

      - name: Run Lighthouse CI (${{ matrix.form_factor }})
        run: |
          if [ "${{ matrix.form_factor }}" = "mobile" ]; then
            pnpm dlx @lhci/cli@0.14.x autorun --config=./lighthouserc.mobile.json
          else
            pnpm dlx @lhci/cli@0.14.x autorun --config=./lighthouserc.json
          fi
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
