<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="675" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="8" fill="#2563eb"/>

  <text x="80" y="96" font-family="Pretendard" font-weight="700" font-size="50" fill="#111827">성과급, 세금 떼면 실제로 얼마 남을까</text>
  <text x="80" y="148" font-family="Pretendard" font-weight="400" font-size="28" fill="#4b5563">간이 시뮬레이션 · 성과급 외 과세표준 1억원인 직장인 가정</text>

  <!-- 가로 막대: 성과급 총액 대비 실수령/세금 -->
  <g font-family="Pretendard">
    <!-- 1억 -->
    <text x="80" y="238" font-weight="700" font-size="30" fill="#111827">성과급 1억원</text>
    <rect x="80" y="256" width="1040" height="52" rx="10" fill="#fee2e2"/>
    <rect x="80" y="256" width="622" height="52" rx="10" fill="#2563eb"/>
    <text x="104" y="291" font-weight="700" font-size="26" fill="#ffffff">실수령 약 5,990만원</text>
    <text x="1096" y="291" font-weight="600" font-size="24" fill="#991b1b" text-anchor="end">세금 약 4,010만원</text>

    <!-- 3억 -->
    <text x="80" y="382" font-weight="700" font-size="30" fill="#111827">성과급 3억원</text>
    <rect x="80" y="400" width="1040" height="52" rx="10" fill="#fee2e2"/>
    <rect x="80" y="400" width="603" height="52" rx="10" fill="#2563eb"/>
    <text x="104" y="435" font-weight="700" font-size="26" fill="#ffffff">실수령 약 1억 7,400만원</text>
    <text x="1096" y="435" font-weight="600" font-size="24" fill="#991b1b" text-anchor="end">세금 약 1억 2,600만원</text>

    <!-- 7억 -->
    <text x="80" y="526" font-weight="700" font-size="30" fill="#111827">성과급 7억원 (언론 추산 시나리오)</text>
    <rect x="80" y="544" width="1040" height="52" rx="10" fill="#fee2e2"/>
    <rect x="80" y="544" width="581" height="52" rx="10" fill="#2563eb"/>
    <text x="104" y="579" font-weight="700" font-size="26" fill="#ffffff">실수령 약 3억 9,100만원</text>
    <text x="1096" y="579" font-weight="600" font-size="24" fill="#991b1b" text-anchor="end">세금 약 3억 900만원</text>
  </g>

  <text x="80" y="646" font-family="Pretendard" font-weight="400" font-size="22" fill="#9ca3af">소득세+지방소득세만 반영한 근사치 · 공제·4대보험에 따라 개인별 차이</text>
  <text x="1120" y="646" font-family="Pretendard" font-weight="600" font-size="22" fill="#9ca3af" text-anchor="end">머니룩 · asiatop.co.kr</text>
</svg>
