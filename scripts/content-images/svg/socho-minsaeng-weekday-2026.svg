<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="675" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="8" fill="#2563eb"/>

  <text x="80" y="98" font-family="Pretendard" font-weight="700" font-size="52" fill="#111827">속초 민생지원금 1인당 20만원</text>
  <text x="80" y="152" font-family="Pretendard" font-weight="400" font-size="30" fill="#4b5563">7월 31일까지는 출생연도 끝자리 요일제로 신청합니다</text>

  <!-- 요일제 카드 5개 -->
  <g font-family="Pretendard" text-anchor="middle">
    <rect x="80" y="200" width="192" height="200" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="176" y="262" font-weight="700" font-size="34" fill="#1d4ed8">월요일</text>
    <text x="176" y="342" font-weight="700" font-size="56" fill="#111827">1 · 6</text>

    <rect x="292" y="200" width="192" height="200" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="388" y="262" font-weight="700" font-size="34" fill="#1d4ed8">화요일</text>
    <text x="388" y="342" font-weight="700" font-size="56" fill="#111827">2 · 7</text>

    <rect x="504" y="200" width="192" height="200" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="600" y="262" font-weight="700" font-size="34" fill="#1d4ed8">수요일</text>
    <text x="600" y="342" font-weight="700" font-size="56" fill="#111827">3 · 8</text>

    <rect x="716" y="200" width="192" height="200" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="812" y="262" font-weight="700" font-size="34" fill="#1d4ed8">목요일</text>
    <text x="812" y="342" font-weight="700" font-size="56" fill="#111827">4 · 9</text>

    <rect x="928" y="200" width="192" height="200" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="1024" y="262" font-weight="700" font-size="34" fill="#1d4ed8">금요일</text>
    <text x="1024" y="342" font-weight="700" font-size="56" fill="#111827">5 · 0</text>
  </g>
  <text x="600" y="446" font-family="Pretendard" font-weight="400" font-size="26" fill="#6b7280" text-anchor="middle">숫자는 출생연도 끝자리 · 8월 1일부터는 요일 제한 없이 신청 가능</text>

  <!-- 하단 핵심 정보 -->
  <rect x="80" y="490" width="1040" height="110" rx="16" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2"/>
  <g font-family="Pretendard" font-size="28" fill="#111827">
    <text x="120" y="536" font-weight="700">신청  7/20 ~ 9/11</text>
    <text x="120" y="578" font-weight="400" fill="#4b5563">CHAK 앱 · 속초시청 홈페이지 · 동 주민센터</text>
    <text x="700" y="536" font-weight="700">사용기한  11/30</text>
