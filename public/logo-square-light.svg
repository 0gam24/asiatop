<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="머니룩 (MoneyLook)">
  <title>머니룩</title>
  <!-- 밝은 배경: 화이트 + 민트 액센트 -->
  <rect width="1000" height="1000" rx="180" fill="#FFFFFF"/>

  <!-- 액센트 그래픽: 차트 막대 (성장 상징) -->
  <g transform="translate(360, 240)">
    <rect x="0" y="120" width="44" height="80" rx="8" fill="#00C896" opacity="0.35"/>
    <rect x="64" y="80" width="44" height="120" rx="8" fill="#00C896" opacity="0.6"/>
    <rect x="128" y="40" width="44" height="160" rx="8" fill="#00C896" opacity="0.85"/>
    <rect x="192" y="0" width="44" height="200" rx="8" fill="#00C896"/>
    <!-- 화살표 상승 -->
    <path d="M 30 60 L 250 -30" stroke="#0F1B2D" stroke-width="10" stroke-linecap="round" fill="none"/>
    <polygon points="240,-50 270,-35 250,-10" fill="#0F1B2D"/>
  </g>

  <!-- 텍스트: 머니룩 -->
  <text x="500" y="650" font-family="Pretendard Variable, Pretendard, -apple-system, system-ui, sans-serif" font-size="180" font-weight="800" fill="#0F1B2D" letter-spacing="-6" text-anchor="middle">머니룩</text>

  <!-- 도트 + 서브 텍스트 -->
  <circle cx="420" cy="780" r="10" fill="#00C896"/>
  <text x="500" y="790" font-family="Pretendard Variable, Pretendard, -apple-system, system-ui, sans-serif" font-size="64" font-weight="600" fill="#6B7785" letter-spacing="1" text-anchor="middle">MoneyLook</text>
</svg>
