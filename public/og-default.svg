<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1B2D"/>
      <stop offset="100%" stop-color="#1A2940"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00C896"/>
      <stop offset="100%" stop-color="#FFB800"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Accent stripe -->
  <rect x="0" y="0" width="8" height="630" fill="url(#accent)"/>

  <!-- Brand mark -->
  <g transform="translate(80, 100)">
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="800" fill="#FFFFFF" letter-spacing="-2">머니룩</text>
    <circle cx="158" cy="44" r="10" fill="#00C896"/>
    <text x="0" y="92" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="500" fill="#6B7785" letter-spacing="0">asiatop.co.kr</text>
  </g>

  <!-- Headline -->
  <g transform="translate(80, 280)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="60" font-weight="800" fill="#FFFFFF" letter-spacing="-3">
      <tspan x="0" dy="0">직장인·청년 생활금융</tspan>
      <tspan x="0" dy="76">한곳에서 정리합니다.</tspan>
    </text>
  </g>

  <!-- Tags -->
  <g transform="translate(80, 510)" font-family="-apple-system, BlinkMacSystemFont, sans-serif">
    <g>
      <rect x="0" y="0" width="120" height="40" rx="20" fill="rgba(0,200,150,0.15)" stroke="rgba(0,200,150,0.5)" stroke-width="1"/>
      <text x="60" y="26" text-anchor="middle" font-size="16" font-weight="600" fill="#00C896">정부지원</text>
    </g>
    <g transform="translate(132, 0)">
      <rect x="0" y="0" width="100" height="40" rx="20" fill="rgba(255,184,0,0.15)" stroke="rgba(255,184,0,0.5)" stroke-width="1"/>
      <text x="50" y="26" text-anchor="middle" font-size="16" font-weight="600" fill="#FFB800">세금환급</text>
    </g>
    <g transform="translate(244, 0)">
      <rect x="0" y="0" width="100" height="40" rx="20" fill="rgba(91,141,239,0.15)" stroke="rgba(91,141,239,0.5)" stroke-width="1"/>
      <text x="50" y="26" text-anchor="middle" font-size="16" font-weight="600" fill="#5B8DEF">실업급여</text>
    </g>
    <g transform="translate(356, 0)">
      <rect x="0" y="0" width="80" height="40" rx="20" fill="rgba(255,107,53,0.15)" stroke="rgba(255,107,53,0.5)" stroke-width="1"/>
      <text x="40" y="26" text-anchor="middle" font-size="16" font-weight="600" fill="#FF6B35">대출</text>
    </g>
    <g transform="translate(448, 0)">
      <rect x="0" y="0" width="80" height="40" rx="20" fill="rgba(124,77,255,0.15)" stroke="rgba(124,77,255,0.5)" stroke-width="1"/>
      <text x="40" y="26" text-anchor="middle" font-size="16" font-weight="600" fill="#7C4DFF">연금</text>
    </g>
  </g>
</svg>
